# KiloWallpaper CI/CD - 四套实现并行编译 + README 校验 + tag 汇总发布
#
# 干什么：
#   1. 并行编译四套实现（cpp / c / rust / zig），各自上传 artifact
#   2. verify job 跑 tools\verify_claims.py：README 里的行数/体积数字必须与实际一致
#   3. tag（v*）推送时：下载全部产物，打包 zip 并创建 GitHub Release
#
# 设计约束：
#   * 只用 GitHub 官方 action（checkout / upload-artifact / download-artifact）
#     + runner 预装工具链（MSVC 2022、Rust stable、Python、gh CLI），不引第三方 action
#   * Zig 不在 runner 预装列表里，CI 里下载官方 zip（~48MB，下载到 runner 的
#     C:\tools，不碰本地磁盘）；版本与本地开发用的 0.13.0 一致
#   * 验证不了什么：runner 没有 Explorer 桌面（无 Progman / WorkerW），
#     「桌面嵌入是否真的生效」CI 无法验证 —— 由 wallpaper.embed 标记与
#     README「各 Windows 版本的验证状态」承担。
#   * 运行时长按最慢的 job（zig 首次下载+编译）估算约 5 分钟。

name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  # ==================== 四套实现并行编译 ====================

  build-cpp:
    name: 编译 cpp
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: 编译（cpp\build.bat）
        run: cpp\build.bat
        shell: cmd

      - name: 自检：产物 PE 有效
        run: |
          foreach ($f in @("cpp\DynamicWallpaper.exe","cpp\DynamicWallpaperGuard.exe")) {
            if (!(Test-Path $f)) { Write-Error "missing $f"; exit 1 }
            $h = [System.IO.File]::ReadAllBytes($f)[0..1]
            $sz = (Get-Item $f).Length
            if ("$([char]$h[0])$([char]$h[1])" -ne "MZ" -or $sz -lt 1024) { Write-Error "bad PE $f"; exit 1 }
            Write-Output "ok $f $sz B"
          }
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: bin-cpp
          path: |
            cpp/DynamicWallpaper.exe
            cpp/DynamicWallpaperGuard.exe
          if-no-files-found: error

  build-c:
    name: 编译 c
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: 编译（c\build.bat）
        run: c\build.bat
        shell: cmd

      - uses: actions/upload-artifact@v4
        with:
          name: bin-c
          path: |
            c/DynamicWallpaper.exe
            c/DynamicWallpaperGuard.exe
          if-no-files-found: error

  build-rust:
    name: 编译 rust
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: 缓存 cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            rust/target
          key: rust-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-

      - name: 编译（cargo build --release）
        run: cargo build --release
        working-directory: rust

      - name: 自检：产物 PE 有效
        run: |
          foreach ($f in @("rust\target\release\DynamicWallpaper.exe","rust\target\release\DynamicWallpaperGuard.exe")) {
            if (!(Test-Path $f)) { Write-Error "missing $f"; exit 1 }
            $h = [System.IO.File]::ReadAllBytes($f)[0..1]
            $sz = (Get-Item $f).Length
            if ("$([char]$h[0])$([char]$h[1])" -ne "MZ" -or $sz -lt 1024) { Write-Error "bad PE $f"; exit 1 }
            Write-Output "ok $f $sz B"
          }
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: bin-rust
          path: |
            rust/target/release/DynamicWallpaper.exe
            rust/target/release/DynamicWallpaperGuard.exe
          if-no-files-found: error

  build-zig:
    name: 编译 zig
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: 下载 Zig 0.13.0（官方 index.json 解析 URL，到 runner 的 C:\tools）
        run: |
          New-Item -ItemType Directory -Force -Path C:\tools | Out-Null
          $j = Invoke-RestMethod https://ziglang.org/download/index.json
          $url = $j.'0.13.0'.'x86_64-windows'.tarball
          if (-not $url) { Write-Error "0.13.0 x86_64-windows not found in index.json"; exit 1 }
          Write-Output "zig url=$url"
          Invoke-WebRequest -Uri $url -OutFile C:\tools\zig.zip
          Expand-Archive -Path C:\tools\zig.zip -DestinationPath C:\tools -Force
          (Get-ChildItem C:\tools -Recurse -Filter zig.exe | Select-Object -First 1).FullName
        shell: pwsh

      - name: 编译（zig build，MSVC 环境）
        run: |
          set ZIGEXE=
          for /f "usebackq tokens=*" %%i in (`dir /b /s C:\tools\zig.exe`) do set ZIGEXE=%%i
          if not defined ZIGEXE (echo zig.exe not found & exit /b 1)
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VS=%%i
          if not defined VS (echo vswhere failed & exit /b 1)
          call "%VS%\VC\Auxiliary\Build\vcvars64.bat"
          cd zig
          "%ZIGEXE%" build -Dtarget=x86_64-windows-msvc -Doptimize=ReleaseFast
        shell: cmd

      - name: 自检：产物 PE 有效
        run: |
          foreach ($f in @("zig\zig-out\bin\DynamicWallpaper.exe","zig\zig-out\bin\DynamicWallpaperGuard.exe")) {
            if (!(Test-Path $f)) { Write-Error "missing $f"; exit 1 }
            $h = [System.IO.File]::ReadAllBytes($f)[0..1]
            $sz = (Get-Item $f).Length
            if ("$([char]$h[0])$([char]$h[1])" -ne "MZ" -or $sz -lt 1024) { Write-Error "bad PE $f"; exit 1 }
            Write-Output "ok $f $sz B"
          }
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: bin-zig
          path: |
            zig/zig-out/bin/DynamicWallpaper.exe
            zig/zig-out/bin/DynamicWallpaperGuard.exe
          if-no-files-found: error

  # ==================== README 数字校验 ====================

  verify:
    name: 校验 README 数字
    needs: build-cpp
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      # verify_claims.py 校验的是 cpp 的行数与二进制体积，需要产物在场
      - name: 编译（供校验）
        run: cpp\build.bat
        shell: cmd

      - name: 校验 README 里的行数与体积
        run: python tools\verify_claims.py
        shell: cmd

  # ==================== tag 汇总发布（CD） ====================

  release:
    name: 汇总发布
    needs: [build-cpp, build-c, build-rust, build-zig]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 下载全部产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 打包 zip
        run: |
          $zip = "KiloWallpaper-${{ github.ref_name }}.zip"
          Compress-Archive -Path artifacts\* -DestinationPath $zip -Force
          Get-Item $zip | Select-Object Name, Length
        shell: pwsh

      - name: 创建 Release 并附带四套产物
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "%GITHUB_REF_NAME%" `
            "KiloWallpaper-${{ github.ref_name }}.zip" `
            "artifacts\bin-cpp\DynamicWallpaper.exe" `
            "artifacts\bin-cpp\DynamicWallpaperGuard.exe" `
            "artifacts\bin-c\DynamicWallpaper.exe" `
            "artifacts\bin-c\DynamicWallpaperGuard.exe" `
            "artifacts\bin-rust\DynamicWallpaper.exe" `
            "artifacts\bin-rust\DynamicWallpaperGuard.exe" `
            "artifacts\bin-zig\DynamicWallpaper.exe" `
            "artifacts\bin-zig\DynamicWallpaperGuard.exe" `
            --title "KiloWallpaper ${{ github.ref_name }}" `
            --generate-notes
        shell: pwsh
