# KiloWallpaper CI/CD - 五套实现并行编译 + README 校验 + tag 汇总发布
#
# 干什么：
#   1. 并行编译五套实现（cpp / c / rust / zig / asm），各自上传 artifact
#   2. verify job 跑 tools\verify_claims.py：README 里的行数/体积数字必须与实际一致
#   3. tag（v*）推送时：下载全部产物，打包 zip 并创建 GitHub Release
#
# 设计约束：
#   * 只用 GitHub 官方 action（checkout / upload-artifact / download-artifact）
#     + runner 预装工具链（MSVC 2022、Rust stable、Python、gh CLI），不引第三方 action
#   * Zig 不在 runner 预装列表里，CI 里下载官方 zip（~48MB，下载到 runner 的
#     C:\tools，不碰本地磁盘）；版本与本地开发用的 0.13.0 一致
#   * 验证不了什么：runner 没有 Explorer 桌面（无 Progman / WorkerW），
#     「桌面嵌入是否真的生效」CI 无法验证 —— 由 wallpaper.embed 标记与
#     README「各 Windows 版本的验证状态」承担。
#   * 运行时长按最慢的 job（zig 首次下载+编译）估算约 5 分钟。

name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  # ==================== 四套实现并行编译 ====================

  build-cpp:
    name: 编译 cpp
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5

      - name: 编译（cpp\build.bat）
        run: cpp\build.bat
        shell: cmd

      - name: 自检：产物 PE 有效
        run: |
          foreach ($f in @("cpp\DynamicWallpaper.exe","cpp\DynamicWallpaperGuard.exe")) {
            if (!(Test-Path $f)) { Write-Error "missing $f"; exit 1 }
            $h = [System.IO.File]::ReadAllBytes($f)[0..1]
            $sz = (Get-Item $f).Length
            if ("$([char]$h[0])$([char]$h[1])" -ne "MZ" -or $sz -lt 1024) { Write-Error "bad PE $f"; exit 1 }
            Write-Output "ok $f $sz B"
          }
        shell: pwsh

      - uses: actions/upload-artifact@v5
        with:
          name: bin-cpp
          path: |
            cpp/DynamicWallpaper.exe
            cpp/DynamicWallpaperGuard.exe
          if-no-files-found: error

  build-c:
    name: 编译 c
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5

      - name: 编译（c\build.bat）
        run: c\build.bat
        shell: cmd

      - uses: actions/upload-artifact@v5
        with:
          name: bin-c
          path: |
            c/DynamicWallpaper.exe
            c/DynamicWallpaperGuard.exe
          if-no-files-found: error

  build-rust:
    name: 编译 rust
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5

      - name: 缓存 cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            rust/target
          key: rust-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-

      - name: 编译（cargo build --release）
        run: cargo build --release
        working-directory: rust

      - name: 自检：产物 PE 有效
        run: |
          foreach ($f in @("rust\target\release\DynamicWallpaper.exe","rust\target\release\DynamicWallpaperGuard.exe")) {
            if (!(Test-Path $f)) { Write-Error "missing $f"; exit 1 }
            $h = [System.IO.File]::ReadAllBytes($f)[0..1]
            $sz = (Get-Item $f).Length
            if ("$([char]$h[0])$([char]$h[1])" -ne "MZ" -or $sz -lt 1024) { Write-Error "bad PE $f"; exit 1 }
            Write-Output "ok $f $sz B"
          }
        shell: pwsh

      - uses: actions/upload-artifact@v5
        with:
          name: bin-rust
          path: |
            rust/target/release/DynamicWallpaper.exe
            rust/target/release/DynamicWallpaperGuard.exe
          if-no-files-found: error

  build-zig:
    name: 编译 zig
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5

      - name: 下载 Zig 0.13.0（官方 index.json 解析 URL，到 runner 的 C:\tools）
        run: |
          New-Item -ItemType Directory -Force -Path C:\tools | Out-Null
          $j = Invoke-RestMethod https://ziglang.org/download/index.json
          $url = $j.'0.13.0'.'x86_64-windows'.tarball
          if (-not $url) { Write-Error "0.13.0 x86_64-windows not found in index.json"; exit 1 }
          Write-Output "zig url=$url"
          Invoke-WebRequest -Uri $url -OutFile C:\tools\zig.zip
          Expand-Archive -Path C:\tools\zig.zip -DestinationPath C:\tools -Force
          (Get-ChildItem C:\tools -Recurse -Filter zig.exe | Select-Object -First 1).FullName
        shell: pwsh

      - name: 编译（zig build，MSVC 环境）
        run: |
          set ZIGEXE=
          for /f "usebackq tokens=*" %%i in (`dir /b /s C:\tools\zig.exe`) do set ZIGEXE=%%i
          if not defined ZIGEXE (echo zig.exe not found & exit /b 1)
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VS=%%i
          if not defined VS (echo vswhere failed & exit /b 1)
          call "%VS%\VC\Auxiliary\Build\vcvars64.bat"
          cd zig
          "%ZIGEXE%" build -Dtarget=x86_64-windows-msvc -Doptimize=ReleaseFast
        shell: cmd

      - name: 自检：产物 PE 有效
        run: |
          foreach ($f in @("zig\zig-out\bin\DynamicWallpaper.exe","zig\zig-out\bin\DynamicWallpaperGuard.exe")) {
            if (!(Test-Path $f)) { Write-Error "missing $f"; exit 1 }
            $h = [System.IO.File]::ReadAllBytes($f)[0..1]
            $sz = (Get-Item $f).Length
            if ("$([char]$h[0])$([char]$h[1])" -ne "MZ" -or $sz -lt 1024) { Write-Error "bad PE $f"; exit 1 }
            Write-Output "ok $f $sz B"
          }
        shell: pwsh

      - uses: actions/upload-artifact@v5
        with:
          name: bin-zig
          path: |
            zig/zig-out/bin/DynamicWallpaper.exe
            zig/zig-out/bin/DynamicWallpaperGuard.exe
          if-no-files-found: error

  build-asm:
    name: 编译 asm
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5

      # ml64 + link，零 CRT；build.bat 内部用 vswhere 定位 MSVC + vcvarsall 配环境
      - name: 编译（asm\build.bat）
        run: asm\build.bat
        shell: cmd

      - name: 自检：产物 PE 有效
        run: |
          $f = "asm\DynamicWallpaper.exe"
          if (!(Test-Path $f)) { Write-Error "missing $f"; exit 1 }
          $h = [System.IO.File]::ReadAllBytes($f)[0..1]
          $sz = (Get-Item $f).Length
          if ("$([char]$h[0])$([char]$h[1])" -ne "MZ" -or $sz -lt 1024) { Write-Error "bad PE $f"; exit 1 }
          Write-Output "ok $f $sz B"
        shell: pwsh

      - uses: actions/upload-artifact@v5
        with:
          name: bin-asm
          path: |
            asm/DynamicWallpaper.exe
          if-no-files-found: error

  # ==================== README 数字校验 ====================

  verify:
    name: 校验 README 数字
    needs: build-cpp
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5

      # verify_claims.py 校验的是 cpp 的行数与二进制体积，需要产物在场
      - name: 编译（供校验）
        run: cpp\build.bat
        shell: cmd

      - name: 校验 README 里的行数与体积
        run: python tools\verify_claims.py
        shell: cmd

  # ==================== tag 汇总发布（CD） ====================

  release:
    name: 汇总发布
    needs: [build-cpp, build-c, build-rust, build-zig, build-asm]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    # GITHUB_TOKEN 默认只有 contents:read，gh release create 需要写权限。
    # 最小权限原则：只给本 job 授 contents:write，编译 job 不给。
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: 下载全部产物
        uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: 打包 zip
        run: |
          $zip = "KiloWallpaper-${{ github.ref_name }}.zip"
          Compress-Archive -Path artifacts\* -DestinationPath $zip -Force
          Get-Item $zip | Select-Object Name, Length
        shell: pwsh

      - name: 清理上次失败可能残留的空 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "$env:GITHUB_REF_NAME" --yes 2>$null
          exit 0
        shell: pwsh

      - name: 创建 Release（不带产物）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" `
            --title "KiloWallpaper ${{ github.ref_name }}" `
            --generate-notes `
            --verify-tag
          if ($LASTEXITCODE -ne 0) { exit 1 }
        shell: pwsh

      - name: 准备上传文件（带语言前缀，四套 exe 同名会互相覆盖）
        run: |
          New-Item -ItemType Directory -Force -Path upload | Out-Null
          Copy-Item artifacts\bin-cpp\DynamicWallpaper.exe      upload\DynamicWallpaper-cpp.exe
          Copy-Item artifacts\bin-cpp\DynamicWallpaperGuard.exe upload\DynamicWallpaperGuard-cpp.exe
          Copy-Item artifacts\bin-c\DynamicWallpaper.exe        upload\DynamicWallpaper-c.exe
          Copy-Item artifacts\bin-c\DynamicWallpaperGuard.exe   upload\DynamicWallpaperGuard-c.exe
          Copy-Item artifacts\bin-rust\DynamicWallpaper.exe     upload\DynamicWallpaper-rust.exe
          Copy-Item artifacts\bin-rust\DynamicWallpaperGuard.exe upload\DynamicWallpaperGuard-rust.exe
          Copy-Item artifacts\bin-zig\DynamicWallpaper.exe      upload\DynamicWallpaper-zig.exe
          Copy-Item artifacts\bin-zig\DynamicWallpaperGuard.exe upload\DynamicWallpaperGuard-zig.exe
          Copy-Item artifacts\bin-asm\DynamicWallpaper.exe      upload\DynamicWallpaper-asm.exe
          Get-ChildItem upload | Select-Object Name, Length
        shell: pwsh

      - name: 上传产物（逐个上传 + 每文件独立重试 + 收尾校验 10 个资产齐全）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $zip = "KiloWallpaper-${{ github.ref_name }}.zip"
          $expect = @(
            'DynamicWallpaper-cpp.exe', 'DynamicWallpaperGuard-cpp.exe',
            'DynamicWallpaper-c.exe', 'DynamicWallpaperGuard-c.exe',
            'DynamicWallpaper-rust.exe', 'DynamicWallpaperGuard-rust.exe',
            'DynamicWallpaper-zig.exe', 'DynamicWallpaperGuard-zig.exe',
            'DynamicWallpaper-asm.exe',
            $zip
          )
          # uploads.github.com 对新建 release 间歇 404（本地单文件稳定、CI 批量必挂），
          # 且批量上传时四套同名 exe 互相覆盖——故：带前缀 + 逐个传 + 独立重试，
          # 每轮先查缺哪些再只传缺的，天然幂等。
          for ($round = 1; $round -le 4; $round++) {
            $have = (gh release view "$env:GITHUB_REF_NAME" --json assets | ConvertFrom-Json).assets.name
            $missing = $expect | Where-Object { $have -notcontains $_ }
            if (-not $missing) { Write-Output "all $($expect.Count) assets present"; exit 0 }
            Write-Output "round $round missing: $($missing -join ', ')"
            foreach ($f in $missing) {
              $path = if ($f -eq $zip) { $f } else { "upload\$f" }
              for ($j = 1; $j -le 3; $j++) {
                gh release upload "$env:GITHUB_REF_NAME" $path --clobber 2>&1 | Out-Null
                if ($LASTEXITCODE -eq 0) { Write-Output "  uploaded $f"; break }
                Write-Output "  $f attempt $j failed"
                Start-Sleep -Seconds 10
              }
            }
            Start-Sleep -Seconds 15
          }
          $have = (gh release view "$env:GITHUB_REF_NAME" --json assets | ConvertFrom-Json).assets.name
          $missing = $expect | Where-Object { $have -notcontains $_ }
          if ($missing) { Write-Error "still missing: $($missing -join ', ')"; exit 1 }
          Write-Output "all $($expect.Count) assets present"
        shell: pwsh
